<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecteur photos</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Fichier CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Fichier JS -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="mb-4">
      <h1 class="fw-bold">Sélecteur de Photos</h1>
    </header>
    <main>
      <section aria-label="Galerie de photos">
        <!-- Liste sans puces et flexbox gérés par Bootstrap -->
        <ul id="photo-list" class="list-unstyled d-flex flex-wrap p-0">
          <li class="rounded"><img src="images/1.jpg" alt="Brin d'herbe" /></li>
          <li class="rounded">
            <img src="images/2.jpg" alt="Coucher de soleil sur l'eau" />
          </li>
          <li class="rounded">
            <img src="images/3.jpg" alt="Allée d'arbres en automne" />
          </li>
          <li class="rounded">
            <img src="images/4.jpg" alt="Chat tigré sur un muret" />
          </li>
          <li class="rounded">
            <img src="images/5.jpg" alt="Plage sous la lune" />
          </li>
          <li class="rounded"><img src="images/6.jpg" alt="Chat siamois" /></li>
          <li class="rounded">
            <img src="images/7.jpg" alt="Fleur violette" />
          </li>
          <li class="rounded">
            <img src="images/8.jpg" alt="Arbre à contre-jour" />
          </li>
          <li class="rounded">
            <img src="images/9.jpg" alt="Chat aux yeux bleus" />
          </li>
          <li class="rounded">
            <img src="images/10.jpg" alt="Goutte d'eau" />
          </li>
        </ul>
      </section>

      <p id="total" class="mt-3">Vous avez sélectionné <em>0</em> photo(s)</p>
    </main>
  </body>
</html>
